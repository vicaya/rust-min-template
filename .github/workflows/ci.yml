name: Template CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: ci-smoke-test

jobs:
  generate:
    name: Generate and check a project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add --toolchain stable rustfmt clippy

      - name: Install cargo-generate
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate

      - name: Generate project from template
        run: |
          cargo generate --path . --name "$PROJECT_NAME" \
            --destination "$RUNNER_TEMP" --vcs none --silent
          echo "PROJECT_DIR=$RUNNER_TEMP/$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Verify rendered placeholders
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -x
          grep -qx "name = \"$PROJECT_NAME\"" Cargo.toml
          grep -qx "# $PROJECT_NAME" README.md
          grep -qx "Copyright $(date +%Y) Sky Computing LLC" LICENSE
          test -f .github/workflows/ci.yml
          test ! -e cargo-generate.toml
          test ! -e pre-script.rhai
          # Liquid leftovers (GitHub `${{ }}` expressions in .github are fine).
          ! grep -rnE '\{\{|\{%' --exclude-dir=.github .

      - name: Check formatting
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo fmt --check

      - name: Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --all-targets --all-features

      - name: Run doctests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --doc --all-features

      - name: Build docs
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
