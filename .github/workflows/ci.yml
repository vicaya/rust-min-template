name: Template CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: ci-smoke-test

jobs:
  generate:
    name: Generate and check a project
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add --toolchain stable rustfmt clippy llvm-tools-preview

      - name: Install cargo-generate and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate,cargo-llvm-cov

      - name: Generate project from template
        run: |
          cargo generate --path . --name "$PROJECT_NAME" \
            --destination "$RUNNER_TEMP" --vcs none --silent
          echo "PROJECT_DIR=$RUNNER_TEMP/$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Verify rendered placeholders
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -x
          grep -qx "name = \"$PROJECT_NAME\"" Cargo.toml
          grep -qx "# $PROJECT_NAME" README.md
          grep -qF "https://github.com/vicaya/$PROJECT_NAME/actions/workflows/ci.yml/badge.svg?branch=main" README.md
          grep -qF "https://github.com/vicaya/$PROJECT_NAME/raw/badges/main/tests.svg" README.md
          grep -qF "https://github.com/vicaya/$PROJECT_NAME/raw/badges/main/coverage.svg" README.md
          cmp scripts/ci/publish-badges.sh "$GITHUB_WORKSPACE/template/scripts/ci/publish-badges.sh"
          grep -qx "Copyright $(date +%Y) Sky Computing LLC" LICENSE
          test -f .github/workflows/ci.yml
          grep -q -- '--fail-under-lines 85' .cargo/config.toml
          test -f AGENTS.md
          test ! -e cargo-generate.toml
          test ! -e pre-script.rhai
          # No Liquid leftovers outside .github (workflows are copied verbatim).
          ! grep -rnE '\{\{|\{%' --exclude-dir=.github .

      - name: Check formatting
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo fmt --check

      - name: Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --all-targets --all-features

      - name: Run doctests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --doc --all-features

      - name: Build docs
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check coverage threshold
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/coverage"
          cargo coverage --json --summary-only --output-path "$RUNNER_TEMP/coverage/coverage.json" 2>&1 \
            | tee "$RUNNER_TEMP/coverage/coverage.log"

      - name: Coverage summary
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage/
          if-no-files-found: error

  # Publishes the generated project's coverage and test-count badges to
  # this repository's `badges` branch (path `<branch>/`), using the
  # scripts the template ships. See template/.github/workflows/ci.yml.
  publish-badges:
    name: Publish badges
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: badges-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage

      - name: Publish
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: sh template/scripts/ci/publish-badges.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_TEMP/coverage/coverage.json" "$RUNNER_TEMP/coverage/coverage.log"

      - name: Verify the README badges render
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh template/scripts/ci/verify-badges-render.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
