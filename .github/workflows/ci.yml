name: Template CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: ci-smoke-test

jobs:
  generate:
    name: Generate and check a project
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add --toolchain stable rustfmt clippy llvm-tools-preview

      - name: Install cargo-generate and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate,cargo-llvm-cov

      - name: Generate project from template
        run: |
          cargo generate --path . --name "$PROJECT_NAME" \
            --destination "$RUNNER_TEMP" --vcs none --silent
          echo "PROJECT_DIR=$RUNNER_TEMP/$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Verify rendered placeholders
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -x
          grep -qx "name = \"$PROJECT_NAME\"" Cargo.toml
          grep -qx "# $PROJECT_NAME" README.md
          grep -qF "https://github.com/vicaya/$PROJECT_NAME/actions/workflows/ci.yml/badge.svg" README.md
          grep -qF "raw.githubusercontent.com/vicaya/$PROJECT_NAME/badges/coverage.json" README.md
          grep -qx "Copyright $(date +%Y) Sky Computing LLC" LICENSE
          test -f .github/workflows/ci.yml
          grep -q -- '--fail-under-lines 85' .cargo/config.toml
          test -f AGENTS.md
          test ! -e cargo-generate.toml
          test ! -e pre-script.rhai
          # No Liquid leftovers outside .github (workflows are copied verbatim).
          ! grep -rnE '\{\{|\{%' --exclude-dir=.github .

      - name: Check formatting
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo fmt --check

      - name: Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --all-targets --all-features

      - name: Run doctests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --doc --all-features

      - name: Build docs
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check coverage threshold
        id: coverage
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cargo coverage --json --summary-only --output-path target/coverage.json
          cargo llvm-cov report --summary-only
          echo "percent=$(jq '.data[0].totals.lines.percent' target/coverage.json)" >> "$GITHUB_OUTPUT"

  coverage-badge:
    name: Publish coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # README.md renders this file through shields.io.
      - name: Push coverage.json to the `badges` branch
        env:
          PERCENT: ${{ needs.generate.outputs.coverage }}
        run: |
          color="$(awk -v p="$PERCENT" 'BEGIN { print (p >= 90 ? "brightgreen" : p >= 80 ? "green" : p >= 70 ? "yellow" : "red") }')"
          git checkout --orphan badges
          git rm -rfq .
          printf '{"schemaVersion":1,"label":"coverage","message":"%.1f%%","color":"%s"}\n' \
            "$PERCENT" "$color" > coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Update coverage badge"
          git push --force origin badges
