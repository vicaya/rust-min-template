name: Template CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: ci-smoke-test

jobs:
  # Decides whether this change needs the build and test jobs, with the
  # classifier the template ships (template/scripts/ci/docs-only.sh). For
  # a docs-only change they are skipped and the `docs` job runs instead.
  # See template/.github/workflows/ci.yml.
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request is checked out as its merge commit, whose first
          # parent is the tip of the base branch.
          fetch-depth: 2

      - name: Classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) if git fetch -q --depth=1 origin "$BEFORE"; then base=$BEFORE; fi ;;
          esac
          if [ -n "$base" ] && sh template/scripts/ci/docs-only.sh "$base" HEAD; then
            echo "Only documentation changed; skipping the build and test jobs."
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  generate:
    name: Generate and check a project (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add --toolchain stable rustfmt clippy

      - name: Install cargo-generate
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate

      - uses: ./.github/actions/generate-project

      - name: Check formatting
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo fmt --check

      - name: Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --all-targets --all-features

      - name: Run doctests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --doc --all-features

      - name: Build docs
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Runs instead of the build and test jobs when only documentation
  # changed: generates the project (the template's Markdown files are
  # rendered too) and checks its doctests and rustdoc, which include the
  # template's README. On main it also checks this repository's README
  # badges.
  docs:
    name: Generate a project, doctests and docs
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-generate
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate

      - uses: ./.github/actions/generate-project

      - name: Run doctests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --doc --all-features

      - name: Build docs
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # A docs-only push to main publishes no badges but may have changed
      # the README that embeds them, so check that it still renders the
      # badges already published for main.
      - name: Verify the README badges render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh template/scripts/ci/verify-badges-render.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"

  # The generated project's line coverage gate, on x86_64 only, so the
  # coverage badge has one figure.
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      report: ${{ steps.report.outputs.complete }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add --toolchain stable llvm-tools-preview

      - name: Install cargo-generate and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate,cargo-llvm-cov

      - uses: ./.github/actions/generate-project

      - name: Check coverage threshold
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/coverage"
          cargo coverage --json --summary-only --output-path "$RUNNER_TEMP/coverage/coverage.json" 2>&1 \
            | tee "$RUNNER_TEMP/coverage/coverage.log"

      - name: Coverage summary
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage/
          if-no-files-found: error

      # Tells publish-badges whether there are figures to publish: a
      # coverage report from a run whose tests all passed. That holds when
      # only the threshold was missed, but not when the tests failed.
      - name: Check for a complete coverage report
        id: report
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/coverage/coverage.json" ] &&
            ! grep -q '^test result: FAILED' "$RUNNER_TEMP/coverage/coverage.log"; then
            echo complete=true >> "$GITHUB_OUTPUT"
          fi

  # The one check to require in branch protection; see the `ci-passed` job
  # in template/.github/workflows/ci.yml.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, generate, docs, coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  # Publishes the generated project's coverage and test-count badges to
  # this repository's `badges` branch (path `<branch>/`), using the
  # scripts the template ships. Also runs when the coverage job failed only
  # on its threshold. See template/.github/workflows/ci.yml.
  publish-badges:
    name: Publish badges
    if: >-
      !cancelled() && needs.coverage.outputs.report == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: badges-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage

      - name: Publish
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: sh template/scripts/ci/publish-badges.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_TEMP/coverage/coverage.json" "$RUNNER_TEMP/coverage/coverage.log"

      - name: Verify the README badges render
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh template/scripts/ci/verify-badges-render.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
