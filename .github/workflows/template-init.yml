name: Customize template

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: template-customize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customize:
    # This workflow bootstraps repositories created from this template by
    # replacing the placeholder repo name and license owner with values taken
    # from the destination repository. It must never run against the
    # template repository itself.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Replace template placeholders
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if ! grep -q 'skys3' Cargo.toml; then
            echo "Template placeholders already customized; nothing to do."
            exit 0
          fi

          sed -i "s#https://github.com/skys3/skys3#https://github.com/${REPO_OWNER}/${REPO_NAME}#" Cargo.toml
          sed -i "s/skys3/${REPO_NAME}/g" Cargo.toml README.md src/lib.rs
          sed -i "s/skys3 contributors/${REPO_OWNER} contributors/" LICENSE

      - name: Commit and push customized files
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: customize template for ${{ github.repository }}"
          git push origin HEAD:${{ github.ref_name }}
