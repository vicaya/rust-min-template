name: Customize template

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: template-customize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customize:
    # This workflow bootstraps repositories created from this template by
    # opening a pull request that replaces the placeholder repo name and
    # license owner with values taken from the destination repository. It
    # must never run against the template repository itself.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Replace template placeholders
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: scripts/customize-template.sh "${REPO_NAME}" "${REPO_OWNER}"

      - name: Open pull request with customized files
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.ref_name }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          branch="template-customization"
          if git ls-remote --exit-code --heads origin "${branch}" > /dev/null 2>&1; then
            echo "Branch '${branch}' already exists; a customization pull request is likely already open."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add -A
          git commit -m "chore: customize template for ${REPO_FULL_NAME}"
          git push origin "${branch}"

          gh pr create \
            --base "${BASE_REF}" \
            --head "${branch}" \
            --title "Customize template for ${REPO_FULL_NAME}" \
            --body "Automated customization: replaces the \`skys3\` placeholder with this repository's name and license owner. Review and merge to finish bootstrapping."
