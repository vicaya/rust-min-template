[template]
# Copy workflows and CI scripts verbatim so GitHub Actions `${{ ... }}`
# expressions are not treated as Liquid placeholders and the scripts can be
# run from this repository unrendered.
exclude = [".github/**", "scripts/**"]

[placeholders.github_owner]
type = "string"
prompt = "GitHub user or organization that will own the repository (for README badges)"
default = "vicaya"
regex = "^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$"

[hooks]
pre = ["pre-script.rhai"]
